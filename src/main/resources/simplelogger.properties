# slf4j-simple configuration for KubeDesk.
#
# Default level for our own and third-party loggers.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# --- Quiet benign fabric8 Kubernetes-client watch noise -----------------------------------------
# When a KubernetesClient with an active Watch is closed (context switch, client recreate) or when a
# watch auto-reconnects during an API-server blip, a last websocket event can arrive after the
# client's executor has shut down. fabric8 then logs a RejectedExecutionException at ERROR from its
# own websocket thread — we cannot catch it, and it is non-actionable: the UI simply re-lists on the
# next successful connect. These two internal managers are the sources of that churn, so we silence
# them to keep the console readable. (Remove or set to 'warn' when debugging watch/reconnect issues.)
org.slf4j.simpleLogger.log.io.fabric8.kubernetes.client.dsl.internal.AbstractWatchManager=off
org.slf4j.simpleLogger.log.io.fabric8.kubernetes.client.dsl.internal.WatchConnectionManager=off
