name: Build distributions

# Build native installers for Windows, macOS and Linux.
#
# - Push a tag like `v0.1.0`  -> builds all installers AND publishes a GitHub Release with them.
# - Run manually (Actions tab -> "Build distributions" -> Run workflow) -> builds + uploads
#   the installers as workflow artifacts (no release).
#
# jpackage cannot cross-compile, so each OS is built on its own runner.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload assets

jobs:
  build:
    name: ${{ matrix.type }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: msi
            pattern: dist/*.msi
          - os: windows-latest
            type: app-image          # portable zip (no installer, runs on a locked-down VDI)
            pattern: dist/*.zip
          - os: macos-latest
            type: dmg
            pattern: dist/*.dmg
          - os: ubuntu-latest
            type: deb
            pattern: dist/*.deb
          - os: ubuntu-latest
            type: rpm
            pattern: dist/*.rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Determine app version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V="0.1.0"
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Building version $V"

      # --- platform-specific packaging prerequisites ---

      - name: Install WiX (Windows, for .msi)
        if: runner.os == 'Windows' && matrix.type == 'msi'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = (Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1).DirectoryName
          if ($wix) { Add-Content -Path $env:GITHUB_PATH -Value $wix }

      - name: Install packaging tools (Linux, for .deb/.rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils rpm

      # --- build the installer using the repo's packaging scripts ---

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -Type ${{ matrix.type }} -AppVersion "$env:APP_VERSION" ${{ matrix.type == 'app-image' && '-Zip' || '' }}

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh ${{ matrix.type }} "$APP_VERSION"

      - name: List output
        shell: bash
        run: ls -la dist

      # --- publish ---

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubedesk-${{ matrix.type }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VER" '
            $0 ~ ("^## \\[" ver "\\]") {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          # Every release page opens with the unsigned-app notice, so people know what the OS warning means.
          cat > NOTICE.md <<'EOF'
          > [!WARNING]
          > **Unsigned app.** KubeDesk installers aren't code-signed yet, so your OS will warn you the first time you open it. That's expected, and here's how to get past it:
          >
          > - **Windows** (SmartScreen, "Windows protected your PC"): click **More info → Run anyway**. For the portable `.zip`, you can also right-click it → **Properties → Unblock** before you unzip.
          > - **macOS** (Gatekeeper, "can't be opened" / "Apple could not verify"): try to open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/KubeDesk.app`.
          > - **Linux** (`.deb` / `.rpm`): no warning.
          >
          > When we have signing set up, we'll re-upload signed builds.

          EOF
          cat NOTICE.md RELEASE_NOTES.md > RELEASE_NOTES.tmp && mv RELEASE_NOTES.tmp RELEASE_NOTES.md
          echo "----- release notes -----"; cat RELEASE_NOTES.md

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.pattern }}
          draft: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
